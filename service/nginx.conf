server {
    listen 80;
    server_name feedback.rangdong.com.vn localhost;

    # Tự động chuyển hướng HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name feedback.rangdong.com.vn localhost;

    # Docker internal DNS — re-resolve 'web' service name every 10s
    # Prevents 502 Bad Gateway after container recreate (stale IP cache)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_web http://web:8501;

    # Đường dẫn file chứng chỉ SSL trong container
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        
        # Hỗ trợ WebSockets (real-time logs & progress)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài cho các tiến trình Excel lớn
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100M;
    }

    # Cấu hình Cache các file tĩnh để giảm tải cho FastAPI
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass $upstream_web;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
