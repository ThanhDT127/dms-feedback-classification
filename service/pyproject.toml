[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-feedback-classifier"
version = "0.1.0"
description = "SharePoint polling service for DMS feedback classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "msal>=1.28.0,<2",
  "requests>=2.31.0,<3",
  "google-genai>=1.0.0,<2",
  "google-generativeai>=0.8.0,<1",
  "pandas>=2.1.0,<3",
  "openpyxl>=3.1.0,<4",
  "rank-bm25>=0.2.2,<1",
  "unidecode>=1.3.0,<2",
  "rapidfuzz>=3.0.0,<4",
  "python-dotenv>=1.0.0,<2",
  "tqdm>=4.65.0,<5",
  "numpy>=1.24.0,<3",
  "scipy>=1.11.0,<2",
  "scikit-learn>=1.6.1,<1.7",
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.0.0,<3",
  "fastapi>=0.111.0,<1",
  "uvicorn[standard]>=0.29.0,<1",
  "python-multipart>=0.0.9,<1",
  "aiofiles>=23.2.0,<25",
  "PyJWT>=2.8.0,<3",
  "bcrypt>=4.1.0,<5",
  "gunicorn>=21.2.0,<24",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "ruff>=0.6.0,<1",
  "mypy>=1.10.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["src/dms"]
