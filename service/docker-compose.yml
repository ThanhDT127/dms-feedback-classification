services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-feedback-watcher

    restart: unless-stopped
    stop_grace_period: 30s
    command: python -m dms
    env_file:
      - .env
    environment:
      - SERVICE_DIR=/app
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/data/Model
      - WORK_DIR=/app/data/work
      - LOG_DIR=/app/data/logs
      - GCP_SERVICE_ACCOUNT_JSON=/app/data/sa-key.json
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/sa-key.json
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env
      - ./Keyword:/app/data/Keyword
      - ./Model:/app/data/Model:ro
      - ./testvertex.json:/app/data/sa-key.json:ro
      - dms_work:/app/data/work
      - dms_logs:/app/data/logs
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,time; d=json.load(open('/app/data/work/health.json')); lp=datetime.datetime.fromisoformat(d['last_poll']); assert time.time()-lp.timestamp()<600, 'stale'"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-feedback-web

    restart: unless-stopped
    command: gunicorn "dms.web.app:create_app()" -w ${GUNICORN_WORKERS:-2} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8501 --timeout 600 --graceful-timeout 120 --keep-alive 120 --access-logfile - --error-logfile -
    expose:
      - "8501"
    env_file:
      - .env
    environment:
      - SERVICE_DIR=/app
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/data/Model
      - WORK_DIR=/app/data/work
      - LOG_DIR=/app/data/logs
      - GCP_SERVICE_ACCOUNT_JSON=/app/data/sa-key.json
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/sa-key.json
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
      - ./static:/app/static
      - ./.env:/app/.env
      - ./Keyword:/app/data/Keyword
      - ./Model:/app/data/Model:ro
      - ./testvertex.json:/app/data/sa-key.json:ro
      - dms_work:/app/data/work
      - dms_logs:/app/data/logs
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: dms-nginx-proxy
    restart: unless-stopped
    ports:
      - "8501:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  dms_work:
  dms_logs:
