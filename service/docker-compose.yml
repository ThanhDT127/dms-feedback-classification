services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-feedback-watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - WORK_DIR=/app/data/work
      - LOG_DIR=/app/data/logs
      - GCP_SERVICE_ACCOUNT_JSON=/app/data/sa-key.json
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/sa-key.json
    volumes:
      # Reference data (read-only) — bundled inside service/
      - ./Keyword:/app/data/Keyword:ro
      # GCP Service Account key (read-only)
      - ./testvertex.json:/app/data/sa-key.json:ro
      # Working directory (read-write, persists checkpoint + seen_files)
      - ./work:/app/data/work
      # Log directory (read-write, persists logs across restarts)
      - ./logs:/app/data/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
