<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phân loại phản hồi tiếp thị — Hệ thống phân loại phản hồi khách hàng">
  <meta name="theme-color" content="#0f1117" id="meta-theme-color">
  <title>Phân loại phản hồi tiếp thị</title>
  <script>
    // FOUC prevention: apply theme before render
    (function() {
      var theme = localStorage.getItem('dms-theme');
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.content = theme === 'light' ? '#f8fafc' : '#0f1117';
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css?v=1.0.6">
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- Mobile overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="window.App.toggleSidebar()"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top bar for mobile -->
    <header class="topbar">
      <button class="topbar-menu" onclick="window.App.toggleSidebar()" aria-label="Menu">☰</button>
      <span class="topbar-title">Phân loại phản hồi tiếp thị</span>
    </header>

    <!-- Page container -->
    <div id="app" class="page-container"></div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Scripts (order matters) -->
  <script src="js/api.js?v=1.0.4"></script>
  <script src="js/ws.js?v=1.0.1"></script>
  <script src="js/components/toast.js?v=1.0.1"></script>
  <script src="js/components/charts.js?v=1.0.5"></script>
  <script src="js/components/password.js?v=1.0.1"></script>
  <script src="js/components/sidebar.js?v=1.0.2"></script>
  <script src="js/pages/dashboard.js?v=1.0.2"></script>
  <script src="js/pages/analytics.js?v=1.0.1"></script>
  <script src="js/pages/files.js?v=1.0.2"></script>
  <script src="js/pages/classify.js?v=1.0.8"></script>
  <script src="js/pages/settings.js?v=1.0.2"></script>
  <script src="js/pages/pipeline.js?v=1.0.1"></script>
  <script src="js/pages/metrics.js?v=1.0.2"></script>
  <script src="js/pages/qa.js?v=1.0.1"></script>
  <script src="js/pages/login.js?v=1.0.1"></script>
  <script src="js/app.js?v=1.0.3"></script>
</body>
</html>
